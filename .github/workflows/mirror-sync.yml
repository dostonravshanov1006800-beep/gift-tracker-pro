name: Mirror Sync (§6.1)
# Держит зеркало полным: новые коллекции подтягиваются в течение часа.
# Два слота в час — страховка от пропусков GitHub cron (наблюдалось: паузы 3-7ч).
on:
  schedule:
    - cron: "18 * * * *"
    - cron: "48 * * * *"
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: true

permissions: { contents: write }

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: '3.12' }
      - run: pip install pillow -q
      - run: python sync.py
      - name: Commit (только при новых картинках)
        run: |
          git config user.name "img-mirror"
          git config user.email "mirror@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "NO CHANGES" && exit 0
          git commit -m "mirror: +new images"
          git push
