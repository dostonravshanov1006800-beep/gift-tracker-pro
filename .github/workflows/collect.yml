name: Collector
# ═══ ПОСТОЯННЫЙ СКАН-ВОРКЕР (самоподдерживающаяся цепочка) ═══
# GitHub-планировщик (cron) на этом репо ни разу не сработал — поэтому воркер
# в конце своего окна сам запускает себе замену через workflow_dispatch
# (секрет KEEPALIVE_TOKEN). Cron */15 оставлен как дублирующий путь: если
# планировщик оживёт, он просто подменит воркера (cancel-in-progress).
# Фронтенд тянет данные напрямую с raw CDN — коммит виден сайту за секунды.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    permissions: { contents: write }
    env:
      KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TG_CHAT_ID: '8396883978'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Persistent scan worker (50 min + передача смены)
        run: |
          git config user.name "radar-collector"
          git config user.email "collector@radar"
          # честный last_scan_at — коммитим heartbeat не реже раза в 45 с
          LAST_HB=0
          START=$(date +%s)
          END=$((START + 50*60))

          commit_cycle() {
            # $1 = выход коллектора, $2 = сколько новых
            NOW=$(date +%s)
            if [ "$2" -gt 0 ]; then
              git add docs/gifts.json docs/status.json docs/live.json docs/history.json docs/fragment.json docs/index.html docs/img collector/state.json collector/samples.json collector/registry.json
              if ! git diff --cached --quiet; then
                echo "$1" | tail -2
                git commit -q -m "collector: +$2 upg ($(date -u +'%H:%M:%S'))"
                git pull --rebase -q -X theirs origin main || true
                git push -q || (sleep 4; git pull --rebase -q -X theirs origin main || true; git push -q || true)
              fi
              LAST_HB=$NOW
            elif [ $((NOW - LAST_HB)) -ge 45 ]; then
              git add docs/status.json
              if ! git diff --cached --quiet; then
                git commit -q -m "collector: heartbeat ($(date -u +'%H:%M:%S'))"
                git pull --rebase -q -X theirs origin main || true
                git push -q || (sleep 4; git pull --rebase -q -X theirs origin main || true; git push -q || true)
              fi
              LAST_HB=$NOW
            fi
          }

          while [ $(date +%s) -lt $END ]; do
            # ── полный проход: все 121 коллекций, S1-S5, fragment-имена ──
            OUT=$(node collector/collect.js 2>&1) || true
            NEW=$(echo "$OUT" | grep -oP 'new=\K[0-9]+' | head -1); NEW=${NEW:-0}
            FRAG=$(echo "$OUT" | grep -oP 'frag=\K[0-9]+' | head -1); FRAG=${FRAG:-0}
            FIX=$(echo "$OUT" | grep -oP 'fix=\K[0-9]+' | head -1); FIX=${FIX:-0}
            # остаток очереди пуша (>0 = недоставленные карточки ждут следующего
            # цикла) — коммитим state.json, чтобы смена воркера их не потеряла
            LEFT=$(echo "$OUT" | grep -oP 'left=\K[0-9]+' | tail -1); LEFT=${LEFT:-0}
            TOT=$((NEW + FRAG + FIX + LEFT))
            commit_cycle "$OUT" "$TOT"

            # ── горячая полоса: только живые коллекции, каждые ~8с → мгновенный детект ──
            for h in 1 2 3 4; do
              [ $(date +%s) -ge $END ] && break
              HOUT=$(HOT=1 node collector/collect.js 2>&1) || true
              HNEW=$(echo "$HOUT" | grep -oP 'new=\K[0-9]+' | head -1); HNEW=${HNEW:-0}
              HLEFT=$(echo "$HOUT" | grep -oP 'left=\K[0-9]+' | tail -1); HLEFT=${HLEFT:-0}
              echo "$HOUT" | grep -E 'push=|HOT lane' || true
              commit_cycle "$HOUT" "$((HNEW + HLEFT))"
              sleep 5
            done
          done
          # ── передача смены: запускаем следующего воркера ──
          echo "окно закрыто, передаю смену"
          curl -s -X POST \
            -H "Authorization: Bearer $KEEPALIVE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/dostonravshanov1006800-beep/gift-tracker-pro/actions/workflows/collect.yml/dispatches \
            -d '{"ref":"main"}' || true
