name: Collector
# ═══ ПОСТОЯННЫЙ СКАН-ВОРКЕР ═══
# Раньше: cron */5 → один цикл → коммит → деплой Pages (итоговая задержка 5-10 мин).
# Теперь: каждый запущенный job — непрерывный воркер: цикл сканирования (~30-60 c)
# → коммит при изменениях → пауза 8 c → повтор, до конца окна. Cron */15 с
# cancel-in-progress — новый запуск подменяет старого воркера, зазор не образуется.
# Фронтенд тянет данные напрямую с raw CDN (мгновенно после коммита), Pages — только оболочка.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Persistent scan worker
        run: |
          git config user.name "radar-collector"
          git config user.email "collector@radar"
          # честный last_scan_at требует коммита даже без апгрейдов — heartbeat,
          # но не чаще 1 раза в 2 минуты при тишине
          LAST_HB=0
          while true; do
            OUT=$(node collector/collect.js 2>&1) || true
            NEW=$(echo "$OUT" | grep -oP 'new=\K[0-9]+' | head -1)
            FRAG=$(echo "$OUT" | grep -oP 'frag=\K[0-9]+' | head -1)
            FIX=$(echo "$OUT" | grep -oP 'fix=\K[0-9]+' | head -1)
            NEW=${NEW:-0}; FRAG=${FRAG:-0}; FIX=${FIX:-0}
            NOW=$(date +%s)
            if [ "$NEW" -gt 0 ] || [ "$FRAG" -gt 0 ] || [ "$FIX" -gt 0 ]; then
              git add docs/gifts.json docs/status.json docs/live.json docs/history.json docs/fragment.json docs/index.html collector/state.json collector/samples.json collector/registry.json
              if ! git diff --cached --quiet; then
                echo "$OUT" | tail -2
                git commit -q -m "collector: +$NEW upg ($(date -u +'%H:%M:%S'))"
                git pull --rebase -q -X theirs origin main || true
                git push -q || (sleep 4; git pull --rebase -q -X theirs origin main || true; git push -q || true)
              fi
              LAST_HB=$NOW
            elif [ $((NOW - LAST_HB)) -ge 45 ]; then
              git add docs/status.json
              if ! git diff --cached --quiet; then
                git commit -q -m "collector: heartbeat ($(date -u +'%H:%M:%S'))"
                git pull --rebase -q -X theirs origin main || true
                git push -q || (sleep 4; git pull --rebase -q -X theirs origin main || true; git push -q || true)
              fi
              LAST_HB=$NOW
            fi
            sleep 8
          done
