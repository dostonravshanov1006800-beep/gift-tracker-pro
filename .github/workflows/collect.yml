name: Collector
# Собственный сборщик данных: t.me-оракул → наши JSON → BOOT-срез в index.html.
# Никаких внешних репозиториев-источников: только публичные страницы Telegram.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: { contents: write }

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@60edb5e5b0469dfbea437f8de95e3e3a3bc6e14  # v4.0.2
        with: { node-version: 20 }
      - name: Run collector
        run: node collector/collect.js
      - name: Commit data
        run: |
          git config user.name "radar-collector"
          git config user.email "collector@radar"
          git add docs/gifts.json docs/status.json docs/live.json docs/history.json docs/index.html collector/state.json collector/samples.json collector/registry.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "collector: cycle $(date -u +'%H:%M')"
          git pull --rebase origin main || true
          git push
