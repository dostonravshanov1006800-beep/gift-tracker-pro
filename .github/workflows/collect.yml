name: Collector
# Собственный конвейер: t.me-оракул → свои JSON → BOOT-срез → Pages.
# Push из GITHUB_TOKEN не триггерит соседние воркфлоу, поэтому Pages выкатываем
# сами вторым job той же цепочки.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run collector
        run: node collector/collect.js
      - name: Commit data
        run: |
          git config user.name "radar-collector"
          git config user.email "collector@radar"
          git add docs/gifts.json docs/status.json docs/live.json docs/history.json docs/index.html collector/state.json collector/samples.json collector/registry.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "collector: cycle $(date -u +'%H:%M')"
          git pull --rebase origin main || true
          git push

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 6
    if: always() && !cancelled()
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { ref: main }
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with: { path: 'docs' }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
