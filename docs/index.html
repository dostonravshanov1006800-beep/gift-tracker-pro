<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GIFT ATELIER — улучшенные подарки</title>
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ GIFT ATELIER v3 — два экрана: улучшения + каталог всех подарков ═══ */
:root{
  --paper:#f4f2ec; --ink:#191712; --ink2:#42403a; --mut:#8a8578; --faint:#b8b2a2;
  --card:#ffffff; --ln:rgba(25,23,18,.08); --ln2:rgba(25,23,18,.16);
  --gold:#c07f19; --gold2:#e8a33d;
  --grn:#1a9e5c; --amb:#d97706; --red:#e0404f;
  --sh-lg:0 24px 48px -12px rgba(25,23,18,.16), 0 4px 12px rgba(25,23,18,.05);
  --sh-md:0 12px 28px -8px rgba(25,23,18,.13), 0 2px 6px rgba(25,23,18,.05);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
}
body.dark{
  --paper:#151310; --ink:#f2efe6; --ink2:#c9c4b6; --mut:#8f897a; --faint:#5c574a;
  --card:#211e18; --ln:rgba(242,239,230,.09); --ln2:rgba(242,239,230,.18);
  --gold:#e0a94a; --gold2:#f0bc59;
  --sh-lg:0 24px 48px -12px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.3);
  --sh-md:0 12px 28px -8px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.25);
  background:#151310;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{
  color:var(--ink); font:14px/1.5 var(--sans);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; padding-bottom:96px;
  background:
    radial-gradient(52% 38% at 88% -6%, hsla(32 82% 55% / .16), transparent 70%),
    radial-gradient(44% 34% at 4% 4%, hsla(264 90% 68% / .12), transparent 70%),
    radial-gradient(40% 30% at 50% 104%, hsla(160 84% 40% / .10), transparent 70%),
    var(--paper);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ln2);
  border-radius:16px;padding:13px 15px;outline:none;width:100%;font-weight:600}
input:focus{border-color:var(--gold2);box-shadow:0 0 0 4px hsla(36 82% 55% / .14)}
::placeholder{color:var(--faint);font-weight:500}
img{-webkit-user-drag:none}
.num{font-feature-settings:'tnum' 1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 hsla(152 70% 38% / .4)}50%{box-shadow:0 0 0 5px hsla(152 70% 38% / 0)}}

/* ─── шапка ─── */
#hdr{
  position:sticky; top:0; z-index:40; padding:14px 18px 12px;
  display:flex; align-items:center; gap:12px;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
#logo{width:44px;height:44px;border-radius:15px;flex:none;background:var(--ink);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#logo::after{content:'';position:absolute;inset:0;background:radial-gradient(60% 60% at 30% 25%, hsla(36 82% 60% / .5), transparent 70%)}
#logo svg{width:22px;height:22px;position:relative;z-index:1}
#brand{flex:1;min-width:0}
#brand b{font-family:var(--serif);font-weight:900;font-style:italic;font-size:21px;letter-spacing:.01em;display:block;line-height:1.1}
#brand b em{font-style:italic;color:var(--gold)}
#brand span{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:6px;text-transform:uppercase}
#ldot{width:7px;height:7px;border-radius:50%;background:var(--grn);display:inline-block;animation:pulse 2.2s infinite}
.hbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1.5px solid var(--ln2);
  display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;flex:none;box-shadow:var(--sh-md)}
.hbtn:active{transform:scale(.92)}
#nbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper)}
.hbtn.alert{border-color:var(--red);box-shadow:0 0 0 4px hsla(348 74% 57% / .12)}

/* ─── editorial-статистика ─── */
#hero{padding:18px 20px 0;display:flex;align-items:flex-end;gap:0}
.heroN{flex:1}
.heroN .k{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.heroN .v{font-family:var(--serif);font-weight:900;font-size:clamp(26px,7.4vw,34px);line-height:1;letter-spacing:-.01em}
.heroN .v.gold{color:var(--gold)}
.heroDiv{width:1px;height:38px;background:var(--ln2);margin:0 16px 4px}
#fresh{padding:10px 20px 0;font-size:11.5px;color:var(--mut);font-weight:600;display:flex;gap:7px;align-items:center}
#fresh i{width:6px;height:6px;border-radius:50%;background:var(--grn);flex:none}

/* ─── панель 5 сканеров ─── */
#scanBox{margin:16px 20px 0;background:var(--card);border:1px solid var(--ln);border-radius:22px;
  padding:14px 16px 10px;box-shadow:var(--sh-md)}
.scanH{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.scanH b{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.scanH span{font-size:10px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:5px}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln)}
.srow:last-child{border-bottom:none}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--grn);animation:breathe 2.4s infinite}
.sdot.off{background:var(--faint);animation:none}
.sinfo{flex:1;min-width:0}
.sname{font-size:11.5px;font-weight:800}
.sname i{font-style:normal;color:var(--gold);margin-left:5px;font-family:var(--serif);font-style:italic}
.stitle{font-size:9.5px;color:var(--mut);font-weight:600;letter-spacing:.03em}
.sstat{font-size:10px;color:var(--mut);font-weight:700;flex:none;text-align:right;line-height:1.35}
.sstat b{color:var(--ink);font-weight:800}

/* ─── секции ─── */
main{padding:0 0 24px}
.pane{display:none}
.pane.on{display:block;animation:fadeUp .35s ease}
.sec{padding:22px 0 0}
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin-bottom:14px}
.sech h2{font-family:var(--serif);font-weight:900;font-size:23px;letter-spacing:-.01em}
.sech h2 i{font-style:italic;color:var(--gold)}
.sech .cnt{font-size:11px;color:var(--mut);font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ─── витрина: дроп-карты ─── */
#showRow{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:6px 20px 20px;margin:0;scrollbar-width:none}
#showRow::-webkit-scrollbar{display:none}
.scard{
  flex:none;width:218px;scroll-snap-align:start;border-radius:26px;position:relative;overflow:hidden;
  background:var(--card);box-shadow:var(--sh-lg);
  border:1px solid var(--ln);
  animation:rise .45s both;animation-delay:var(--d,0ms);
}
.scard:active{transform:scale(.97) rotate(-.4deg);transition:.12s}
.sart{position:relative;width:100%;aspect-ratio:1/.92;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, hsl(var(--h) 88% 62% / .30), transparent 60%),
    linear-gradient(170deg, hsl(var(--h) 70% 88%), hsl(calc(var(--h) + 40) 60% 94%));}
body.dark .sart{background:
    radial-gradient(120% 90% at 50% 0%, hsl(var(--h) 80% 40% / .35), transparent 60%),
    linear-gradient(170deg, hsl(var(--h) 40% 16%), hsl(calc(var(--h) + 40) 30% 10%));}
.sart img{width:100%;height:100%;object-fit:cover;
  filter:drop-shadow(0 10px 24px hsl(var(--h) 60% 30% / .35))}
.sart .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:44px;font-weight:900;font-style:italic;color:hsl(var(--h) 65% 52%)}
.sover{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 13px;
  background:linear-gradient(transparent, rgba(15,14,10,.78));color:#fff}
.sover .sname{font-weight:800;font-size:14.5px;letter-spacing:.01em}
.sover .snum{font-family:var(--serif);font-weight:900;font-style:italic;font-size:22px;line-height:1.1;margin:1px 0 1px}
.sover .sago{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.05em;text-transform:uppercase}
.schip{position:absolute;top:11px;right:11px;background:var(--ink);color:var(--paper);font-size:9.5px;font-weight:800;
  letter-spacing:.12em;padding:6px 10px;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.schip.hot{background:var(--red);color:#fff;animation:pulse 1.6s infinite}

/* ─── лента ─── */
#feedList{padding:0 20px}
.frow{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--ln)}
.frow:last-child{border-bottom:none}
.fdot{width:46px;height:46px;border-radius:16px;flex:none;overflow:hidden;position:relative;
  background:linear-gradient(150deg, hsl(var(--h) 75% 90%), hsl(calc(var(--h) + 40) 60% 95%));
  box-shadow:var(--sh-md)}
body.dark .fdot{background:linear-gradient(150deg, hsl(var(--h) 40% 18%), hsl(calc(var(--h) + 40) 30% 12%))}
.fdot img{width:100%;height:100%;object-fit:cover}
.fdot span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-style:italic;font-size:16px;color:hsl(var(--h) 60% 48%)}
.fbody{flex:1;min-width:0}
.f1{font-weight:800;font-size:14.5px}
.f1 .fnum{font-family:var(--serif);font-style:italic;font-weight:900;color:var(--gold);font-size:15.5px}
.f2{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
.ftime{font-size:10.5px;color:var(--faint);font-weight:700;flex:none;letter-spacing:.03em}

/* ─── каталог всех подарков ─── */
#colGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
.ccard{border-radius:24px;background:var(--card);overflow:hidden;position:relative;box-shadow:var(--sh-md);
  border:1px solid var(--ln);animation:rise .45s both;animation-delay:var(--d,0ms)}
.ccard:active{transform:scale(.97);transition:.12s}
.ccard.fin{opacity:.6}
.cimgw{position:relative;aspect-ratio:1.15;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, hsl(var(--h) 85% 60% / .26), transparent 62%),
    linear-gradient(170deg, hsl(var(--h) 70% 89%), hsl(calc(var(--h) + 40) 60% 95%));}
body.dark .cimgw{background:
    radial-gradient(120% 90% at 50% 0%, hsl(var(--h) 75% 42% / .32), transparent 62%),
    linear-gradient(170deg, hsl(var(--h) 40% 16%), hsl(calc(var(--h) + 40) 30% 11%));}
.ccard img{width:100%;height:100%;object-fit:cover;filter:drop-shadow(0 8px 18px hsl(var(--h) 60% 30% / .3))}
.cfb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-style:italic;font-size:32px;color:hsl(var(--h) 60% 50%)}
.ctag{position:absolute;top:9px;right:9px;background:var(--ink);color:var(--paper);font-size:9px;font-weight:800;
  letter-spacing:.1em;padding:5px 9px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.ctag.hot{background:var(--red);color:#fff}
.ctag.fin{background:var(--grn);color:#fff}
.cinfo{padding:12px 13px 13px}
.cname{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum{font-size:11.5px;color:var(--mut);margin:3px 0 9px;font-weight:700}
.cbar{height:6px;border-radius:4px;background:var(--ln);overflow:hidden;margin-bottom:9px}
.cbar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg, hsl(var(--h) 70% 52%), hsl(calc(var(--h) + 35) 75% 55%))}
.ceta{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;color:var(--mut)}
.ceta b{font-weight:800;color:var(--grn)}
.ceta b.m{color:var(--amb)}
.ceta b.l{color:var(--faint);font-weight:700}

/* ─── настройки ─── */
.srowS{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 2px;border-bottom:1px solid var(--ln)}
.srowS .st b{font-size:13px;font-weight:800;letter-spacing:.03em;display:block}
.srowS .st span{font-size:11px;color:var(--mut);font-weight:600}
.sw{width:50px;height:29px;border-radius:16px;background:var(--ln);position:relative;transition:.25s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.25);transition:.25s}
.sw.on{background:linear-gradient(120deg, var(--gold2), var(--gold))}
.sw.on::after{left:24px}
.note{font-size:11.5px;color:var(--mut);line-height:1.7;padding-top:16px;font-weight:500}
.btn{background:var(--ink);color:var(--paper);font-weight:800;font-size:13.5px;border-radius:16px;padding:13px 18px;
  box-shadow:var(--sh-md);letter-spacing:.01em}
body.dark .btn{color:#fff}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(120deg, var(--gold2), var(--gold));color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--ln2);box-shadow:none;color:var(--ink)}

/* ─── навигация: плавающая капсула ─── */
#tabs{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:45;display:flex;gap:2px;
  background:color-mix(in srgb, var(--card) 92%, transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--ln2);border-radius:24px;padding:7px;box-shadow:var(--sh-lg);max-width:calc(100vw - 24px)}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 26px 7px;color:var(--faint);
  font-size:9.5px;font-weight:800;letter-spacing:.08em;border-radius:17px;transition:.2s}
.tbtn svg{width:21px;height:21px}
.tbtn.on{background:var(--ink);color:var(--paper);box-shadow:0 6px 16px rgba(0,0,0,.25)}
body.dark .tbtn.on{color:#fff}
.tbtn:active{transform:scale(.93)}

/* ─── оверлеи ─── */
#ovl{position:fixed;inset:0;background:rgba(21,19,16,.5);z-index:60;opacity:0;pointer-events:none;transition:.25s}
#ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--paper);border-radius:30px 30px 0 0;
  padding:14px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(103%);transition:transform .32s cubic-bezier(.2,.9,.3,1);
  max-height:84vh;overflow-y:auto;box-shadow:0 -20px 60px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:4px;background:var(--ln2);margin:0 auto 14px}
.shgrid{display:flex;gap:15px;align-items:flex-start}
.shimgw{width:112px;height:112px;border-radius:24px;flex:none;position:relative;overflow:hidden;box-shadow:var(--sh-lg);
  background:
    radial-gradient(120% 90% at 50% 0%, hsl(var(--h) 85% 60% / .28), transparent 62%),
    linear-gradient(170deg, hsl(var(--h) 70% 89%), hsl(calc(var(--h) + 40) 60% 95%));}
body.dark .shimgw{background:linear-gradient(170deg, hsl(var(--h) 40% 16%), hsl(calc(var(--h) + 40) 30% 11%))}
.shimgw img{width:100%;height:100%;object-fit:cover}
.shfb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-style:italic;font-weight:900;font-size:40px;color:hsl(var(--h) 60% 48%)}
.shtitle{flex:1;min-width:0;padding-top:4px}
.shtitle h3{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.1;margin-bottom:6px}
.bignum{font-family:var(--serif);font-style:italic;font-weight:900;font-size:15px;color:var(--gold)}
.meter{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:16px 0 14px}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg, var(--gold2), var(--gold));
  box-shadow:0 2px 10px hsla(36 82% 45% / .4)}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvc{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:11px 13px;box-shadow:var(--sh-md)}
.kvc .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.kvc .v{font-family:var(--serif);font-weight:900;font-size:17px;margin-top:3px}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.minilist .mr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px;font-weight:600}
.shbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* панель уведомлений */
#npanel{position:fixed;inset:0 0 0 auto;width:min(92vw,380px);z-index:80;background:var(--paper);
  border-left:1px solid var(--ln2);transform:translateX(103%);transition:transform .32s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
#npanel.on{transform:none}
.nphead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--ln)}
.nphead b{font-family:var(--serif);font-weight:900;font-size:19px}
#nlist{flex:1;overflow-y:auto;padding:6px 20px}
.ntf{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.ntf .ni{width:40px;height:40px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px}
.ntf.upg .ni{background:hsla(36 82% 45% / .16)}
.ntf .nb{flex:1;min-width:0}
.ntf .nt{font-weight:800;font-size:13px}
.ntf .nm{font-size:11.5px;color:var(--mut);margin-top:2px;font-weight:600}
.ntf .tm{font-size:10px;color:var(--faint);flex:none;font-weight:700}
#nbanners{position:fixed;top:12px;left:12px;right:12px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nban{pointer-events:auto;display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:13px 15px;
  animation:fadeUp .32s ease;box-shadow:var(--sh-lg);border:1px solid var(--ln2)}
.nban.out{opacity:0;transform:translateY(-14px);transition:.3s}
.nban .ni{width:38px;height:38px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.nban.upg .ni{background:hsla(36 82% 45% / .16)}
.nban .nt{font-weight:800;font-size:12.5px}
.nban .nm{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}

#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(12px);z-index:95;
  background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 18px;
  font-size:12.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:var(--sh-lg)}
body.dark #toast{color:#fff}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{border:1.5px dashed var(--ln2);border-radius:20px;padding:26px 16px;text-align:center;color:var(--faint);font-size:12.5px;margin:4px 0;font-weight:600}
</style>

function renderStats(){
  $('roUpg').textContent = fmtNum(statD.detected_total||0);

  var dayAgo = Date.now()/1000 - 86400, kinds = {};

  $('roKinds').textContent = fmtNum(Object.keys(kinds).length);
  var hourAgo = Date.now()/1000 - 3600, vel = 0;
  feedEvents.forEach(function(e){ if (evTs(e) >= hourAgo) vel++; });
  $('roVel').textContent = String(vel);
  var su = Number(statD.updated_unix)||0;

      '<div class="cimgw"><img loading="lazy" decoding="async" src="' + esc(artOf(slug)) + '" onerror="this.outerHTML=\'<div class=&quot;cfb&quot;>' + esc(monogram(slug)) + '</div>\'">' +
      (hot ? '<span class="ctag hot">LIVE</span>' : (fin ? '<span class="ctag fin">FIN</span>' : '')) + '</div>' +
      '<div class="cinfo"><div class="cname">' + esc(g.name||slug) + '</div>' +
      '<div class="cnum num">' + fmtNum(g.issued) + ' / ' + fmtNum(g.total) + '</div>' +
      '<div class="cbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="ceta"><span>' + pct + '%</span>' + etaChip + '</div></div></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('.ccard'), function(c){
    c.addEventListener('click', function(){ haptic(); openColSheet(c.getAttribute('data-slug')); });
  });
}
(function(){
  var s = $('colSearch'), t = 0;
  s.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(function(){ colQuery = s.value; renderCatalog(); }, 180); });
})();
</script>

<script>
"use strict";
/* ═══ шит коллекции ═══ */
function openColSheet(slug){
  var g = findBySlug(slug); if (!g) return;
  var pct = g.total ? Math.min(100, Math.round((g.issued/g.total)*100)) : 0;
  var eta = etaOf(slug, g.issued, g.total);
  var etaLine = eta.done ? 'выпущено полностью' : (eta.hours ? (eta.hours < 24 ? '~' + Math.max(1, Math.round(eta.hours)) + ' ч' : '~' + (eta.hours/24).toFixed(1) + ' дн') : 'мало данных');
  var recent = feedEvents.filter(function(e){ return String(e.slug||'').trim() === slug; }).slice(0,4);
  var html =
  '<div class="shgrid" style="--h:' + hueOf(slug) + '">' +
    '<div class="shimgw"><img src="' + esc(artOf(slug)) + '" onerror="this.outerHTML=\'<div class=&quot;shfb&quot;>' + esc(monogram(slug)) + '</div>\'"></div>' +
    '<div class="shtitle"><h3>' + esc(g.name||slug) + '</h3><div class="bignum num">' + fmtNum(g.issued) + ' / ' + fmtNum(g.total) + ' · ' + pct + '%</div></div>' +
  '</div>' +
  '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
  '<div class="kvgrid">' +
    '<div class="kvc"><div class="k">выпуск до конца</div><div class="v">' + esc(etaLine) + '</div></div>' +
    '<div class="kvc"><div class="k">темп / час</div><div class="v">' + (eta.rate ? eta.rate.toFixed(1) : '—') + '</div></div>' +
  '</div>' +
  (recent.length ? '<div class="lbl" style="margin:14px 0 2px">последние улучшения</div><div class="minilist">' +
    recent.map(function(e){
      return '<div class="mr"><b class="num">#' + fmtNum(e.counter_issued||e.number) + '</b><span>NFT</span><span style="color:var(--faint)">' + esc(evAgo(e)) + '</span></div>';
    }).join('') + '</div>' : '') +
  '<div class="shbtns">' +
    '<button class="btn gold" id="shOpen">Открыть на t.me ↗</button>' +
    '<button class="btn ghost" id="shFrag">Fragment ↗</button>' +
  '</div>';
  $('colBody').innerHTML = html;
  $('shOpen').addEventListener('click', function(){ openLink('https://t.me/nft/' + slug.toLowerCase() + '-' + Math.max(1, g.issued)); });
  $('shFrag').addEventListener('click', function(){ openLink('https://fragment.com/gifts/' + slug.toLowerCase()); });
  $('ovl').classList.add('on'); $('sheetCol').classList.add('on');
}
function closeSheets(){ $('ovl').classList.remove('on'); $('sheetCol').classList.remove('on'); $('sheetSet').classList.remove('on'); }
$('ovl').addEventListener('click', closeSheets);
$('btnSet').addEventListener('click', function(){ haptic(); renderSettings(); $('ovl').classList.add('on'); $('sheetSet').classList.add('on'); });

function renderSettings(){
  var html =
  '<div class="srowS"><div class="st"><b>ТЕМА</b><span>светлая / тёмная / авто</span></div>' +
    '<div style="display:flex;gap:6px">' +
      ['auto','light','dark'].map(function(v){
        return '<button data-th="' + v + '" style="padding:8px 12px;border-radius:12px;background:' + (THEME === v ? 'var(--ink)' : 'var(--ln)') + ';color:' + (THEME === v ? 'var(--paper)' : 'var(--ink2)') + ';font-size:12px;font-weight:800">' + (v === 'auto' ? 'А' : v === 'dark' ? '◐' : '◑') + '</button>';
      }).join('') +
    '</div></div>' +
  '<div class="srowS"><div class="st"><b>ЗВУК УЛУЧШЕНИЯ</b><span>сигнал при новом апгрейде</span></div><div class="sw' + (SOUND ? ' on' : '') + '" id="swSound"></div></div>' +
  '<div class="srowS"><div class="st"><b>БАННЕРЫ</b><span>всплывающие уведомления</span></div><div class="sw' + (NQ.cfg.banners ? ' on' : '') + '" id="swBan"></div></div>' +
  '<div class="srowS"><div class="st"><b>ВИБРАЦИЯ</b><span>отклик при событии</span></div><div class="sw' + (NQ.cfg.vibro ? ' on' : '') + '" id="swVib"></div></div>' +
  '<div class="note">GIFT ATELIER · 5 независимых сканеров ищут улучшения на первоисточнике Telegram. Витрина и лента обновляются каждые несколько секунд, полный цикл сканирования — каждые 5 минут. Имена коллекций — данные nft.fragment.com.</div>';
  $('setBody').innerHTML = html;
  Array.prototype.forEach.call($('setBody').querySelectorAll('[data-th]'), function(b){
    b.addEventListener('click', function(){ THEME = b.getAttribute('data-th'); localStorage.setItem('gm_theme', THEME); applyTheme(); renderSettings(); });
  });
  $('swSound').addEventListener('click', function(){ SOUND = !SOUND; localStorage.setItem('gm_sound', SOUND ? '1' : '0'); renderSettings(); });
  $('swBan').addEventListener('click', function(){ NQ.cfg.banners = !NQ.cfg.banners; nqSave(); renderSettings(); });
  $('swVib').addEventListener('click', function(){ NQ.cfg.vibro = !NQ.cfg.vibro; nqSave(); renderSettings(); });
}
</script>

<script>
"use strict";
/* ═══ собственная система уведомлений (внутри мини-апа) ═══ */
var NQ = { list: [], unread: 0, cfg: { sound: true, vibro: true, banners: true } };
function nqLoad(){
  try { var l = JSON.parse(localStorage.getItem('radar_nq') || '[]'); if (Object.prototype.toString.call(l) === '[object Array]') NQ.list = l.slice(0, 60); } catch(e){}
  try { var c = JSON.parse(localStorage.getItem('radar_ncfg') || 'null'); if (c) NQ.cfg = { sound: c.sound !== false, vibro: c.vibro !== false, banners: c.banners !== false }; } catch(e){}
}
function nqSave(){
  try { localStorage.setItem('radar_nq', JSON.stringify(NQ.list.slice(0, 60))); } catch(e){}
  try { localStorage.setItem('radar_ncfg', JSON.stringify(NQ.cfg)); } catch(e){}
}
function nqAgo(ts){ var m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'сейчас'; if (m < 60) return m + 'м'; return Math.round(m/60) + 'ч'; }
function nqSound(kind){
  if (!NQ.cfg.sound) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    var ctx = nqSound.ctx || (nqSound.ctx = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime;
    var freqs = kind === 'upg' ? [659.25, 783.99] : [523.25, 659.25];
    freqs.forEach(function(f, i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * .12);
      g.gain.exponentialRampToValueAtTime(.16, t + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .12 + .28);
      o.connect(g); g.connect(ctx.destination);
      o.start(t + i * .12); o.stop(t + i * .12 + .3);
    });
  } catch(e){}
}
function nqVibro(){
  if (!NQ.cfg.vibro) return;
  try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); return; } } catch(e){}
  try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch(e){}
}
function nqPush(type, ico, title, msg, slug, num){
  var n = { id: type+'-'+slug+'-'+num+'-'+Date.now(), type: type, ico: ico, title: title, msg: msg, slug: slug, num: num, ts: Date.now(), read: false };
  NQ.list.unshift(n);
  if (NQ.list.length > 60) NQ.list.length = 60;
  NQ.unread++; nqSave(); nqBadge(); nqRender();
  if (NQ.cfg.banners) nqBanner(n);
  nqSound(type); nqVibro();
}
function nqBadge(){
  var b = $('nbadge'); if (!b) return;
  b.textContent = NQ.unread > 99 ? '99+' : (NQ.unread > 0 ? String(NQ.unread) : '');
  b.style.display = NQ.unread > 0 ? 'flex' : 'none';
  $('btnBell').classList.toggle('alert', NQ.unread > 0);
}
function nqBanner(n){
  var wrap = $('nbanners'); if (!wrap) return;
  var d = document.createElement('div');
  d.className = 'nban ' + n.type;
  d.innerHTML = '<div class="ni">' + n.ico + '</div><div class="nb"><div class="nt">' + esc(n.title) + '</div><div class="nm">' + esc(n.msg) + '</div></div>';
  d.addEventListener('click', function(){ d.remove(); if (n.slug) openColSheet(n.slug); });
  wrap.appendChild(d);
  setTimeout(function(){ d.classList.add('out'); setTimeout(function(){ d.remove(); }, 320); }, 5200);
}
function nqRender(){
  var list = $('nlist'); if (!list) return;
  if (!NQ.list.length){ list.innerHTML = '<div class="empty" style="border:none">уведомлений нет</div>'; return; }
  list.innerHTML = NQ.list.map(function(n){
    return '<div class="ntf ' + n.type + '" data-id="' + esc(n.id) + '">' +
      '<div class="ni">' + n.ico + '</div>' +
      '<div class="nb"><div class="nt">' + esc(n.title) + '</div><div class="nm">' + esc(n.msg) + '</div></div>' +
      '<div class="tm">' + nqAgo(n.ts) + '</div></div>';
  }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('.ntf'), function(el){
    el.addEventListener('click', function(){
      var n = null;
      for (var i=0;i<NQ.list.length;i++) if (NQ.list[i].id === el.getAttribute('data-id')) { n = NQ.list[i]; break; }
      if (!n) return;
      n.read = true; nqSave(); el.style.opacity = .6; nqBadge();
      if (n.slug){ $('npanel').classList.remove('on'); openColSheet(n.slug); }
    });
  });
}
function nqPanelToggle(){
  var p = $('npanel'); if (!p) return;
  var on = p.classList.toggle('on');
  haptic();
  if (on){ NQ.list.forEach(function(n){ n.read = true; }); NQ.unread = 0; nqSave(); nqBadge(); nqRender(); }
}
function nqClear(){ NQ.list = []; NQ.unread = 0; nqSave(); nqBadge(); nqRender(); haptic(); }
$('btnBell').addEventListener('click', nqPanelToggle);
$('npClear').addEventListener('click', nqClear);
nqLoad(); nqBadge(); nqRender();
</script>

<script>
"use strict";
/* ═══ refresh-цикл данных (обновляется каждые 6 секунд) ═══ */
var liveTsMax = 0, firstLoad = true, lastSeenTs = 0;
function beep(){
  if (!SOUND) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=0.18;
    o.connect(g); g.connect(ctx.destination); o.start();
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime+0.18);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.45);
    o.stop(ctx.currentTime+0.46);
  } catch(e){}
}
function newUpgradeAlert(evts){
  if (firstLoad){ firstLoad = false; if (evts.length) lastSeenTs = evts[0].mint || 0; return; }
  var fresh = [];
  for (var i=0;i<evts.length;i++){ var t = evts[i].mint || 0; if (t > lastSeenTs) fresh.push(evts[i]); }
  if (fresh.length && lastSeenTs){
    beep();
    var newest = fresh[0];
    var slug = String(newest.slug||'').trim();
    var nm = newest.gift || slug;
    var num = newest.counter_issued || newest.number || 0;
    nqPush('upg','🚀','УЛУЧШЕНИЕ · ' + nm,
      fresh.length > 1 ? ('#' + fmtNum(num) + ' и ещё ' + (fresh.length - 1) + ' — сканеры поймали ' + fresh.length + ' новых') : ('номер #' + fmtNum(num) + ' улучшен до NFT'),
      slug, Number(num));
  }
  if (evts.length) lastSeenTs = evts[0].mint || 0;
}
function renderAll(){ renderStats(); renderScanners(); renderShowcase(); renderFeed(); renderCatalog(); }
function refresh(light){
  var FETCHES = light
    ? [jget('status.json'), jget('gifts.json'), null, jget('live.json').catch(function(){ return { items: {} }; })]
    : [jget('status.json'), jget('gifts.json'), jget('history.json').catch(function(){ return { hours: [] }; }), jget('live.json').catch(function(){ return { items: {} }; })];
  Promise.all(FETCHES)
  .then(function(res){
    if (res[0] && res[0].__stale && feedEvents.length) return;
    statD = res[0] || {};
    histData = (res[2] && res[2].hours) ? res[2].hours : (histData || []);
    giftsData = (res[1] && res[1].gifts) ? res[1].gifts : [];
    if (statD.scanners) scannerData = statD.scanners;
    var liveItems = (res[3] && res[3].items) ? res[3].items : {};
    var lvTs = 0;
    for (var lk in liveItems){ var lt = liveItems[lk] && Number(liveItems[lk].ts)||0; if (lt > lvTs) lvTs = lt; }
    liveTsMax = lvTs;
    if (liveItems) giftsData.forEach(function(g){
      var lv = liveItems[String(g.slug||g.name).trim()];
      if (!lv) return;
      var li = Number(lv.i)||0, gi = Number(g.issued)||0;
      if (li >= gi){ g.issued = li; g.total = Number(lv.t)||Number(g.total)||0; }
    });
    var evts = (statD.last_upgrades||[]).slice().sort(function(a2,b2){
      var ta = evTs(a2), tb = evTs(b2);
      if (tb !== ta) return tb - ta;
      return (Number(b2.number)||0) - (Number(a2.number)||0);
    });
    feedEvents = evts;
    hotMap = {};
    var dayAgo = Date.now()/1000 - 86400;
    evts.forEach(function(e){
      var t = evTs(e); var key = String(e.slug||'').trim();
      if (!key || t < dayAgo) return;
      if (!hotMap[key] || t > hotMap[key]) hotMap[key] = t;
    });
    newUpgradeAlert(evts);
    renderAll();
  })
  .catch(function(){});
}

/* ═══ BOOT: мгновенный первый кадр без сети ═══ */
(function bootPrime(){
  if (!window.BOOT || !window.BOOT.g) return;
  window.BOOT.g.forEach(function(x){
    giftsData.push({ slug: x[0], name: x[1] || x[0], issued: x[2], total: x[3], rate: 0, added: 0 });
  });
  statD = { updated_unix: window.BOOT.ts, detected_total: window.BOOT.u, last_upgrades: window.BOOT.r || [] };
  if (window.BOOT.s) scannerData = window.BOOT.s;
  feedEvents = (statD.last_upgrades || []).slice();
  var dayAgo = Date.now()/1000 - 86400;
  feedEvents.forEach(function(e){
    var t = evTs(e); var key = String(e.slug||'').trim();
    if (!key || t < dayAgo) return;
    if (!hotMap[key] || t > hotMap[key]) hotMap[key] = t;
  });
  renderAll();
})();

refresh(true);
setTimeout(function(){ refresh(false); }, 2500);
setInterval(function(){ refresh(true); }, 6000);
setInterval(function(){ refresh(false); }, 180000);
setInterval(function(){ if (feedEvents.length || giftsData.length) renderStats(); }, 30000);
</script>
