<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f0f3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gift Atelier — улучшенные подарки</title>
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══ GIFT ATELIER v4 — Telegram-blue, iOS-native стиль, два экрана ═══ */
:root{
  --bg:#eef1f5; --card:#ffffff; --card2:#f4f6f9;
  --ln:rgba(15,25,45,.08); --ln2:rgba(15,25,45,.14);
  --accent:#229ED9; --accent2:#2AABEE; --accentD:#1b84b5;
  --ink:#0f1419; --ink2:#44505c; --mut:#7c8a99; --faint:#b2bcc6;
  --grn:#34c759; --amb:#ff9500; --red:#ff3b30;
  --sh-lg:0 20px 40px -14px rgba(15,25,45,.14), 0 4px 10px rgba(15,25,45,.04);
  --sh-md:0 10px 24px -8px rgba(15,25,45,.11), 0 2px 6px rgba(15,25,45,.04);
  --sans:'Manrope',-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;
}
body.dark{
  --bg:#0e1621; --card:#17212b; --card2:#1c2733;
  --ln:rgba(230,238,245,.07); --ln2:rgba(230,238,245,.13);
  --accent:#5fb8ec; --accent2:#6ec3f4; --accentD:#3390ec;
  --ink:#e8edf2; --ink2:#b7c2cc; --mut:#7e8b97; --faint:#4b5664;
  --sh-lg:0 20px 44px -14px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.3);
  --sh-md:0 10px 26px -8px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  background:#0e1621;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  color:var(--ink); font:14px/1.46 var(--sans);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; padding-bottom:92px;
  background:var(--bg);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--ink);background:var(--card2);border:1.5px solid transparent;
  border-radius:14px;padding:12px 14px 12px 40px;outline:none;width:100%;font-weight:600}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px hsla(200 80% 50% / .14)}
::placeholder{color:var(--faint);font-weight:600}
img{-webkit-user-drag:none}
.num{font-feature-settings:'tnum' 1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 hsla(145 65% 45% / .4)}50%{box-shadow:0 0 0 5px hsla(145 65% 45% / 0)}}

/* ─── шапка (как в референсе: крупный заголовок + статус) ─── */
#hdr{
  position:sticky; top:0; z-index:40; padding:16px 18px 10px;
  display:flex; align-items:center; gap:12px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#logo{width:40px;height:40px;border-radius:13px;flex:none;
  background:linear-gradient(135deg, var(--accent2), var(--accentD));
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px hsla(200 70% 45% / .35)}
#logo svg{width:21px;height:21px}
#brand{flex:1;min-width:0}
#brand b{font-weight:900;font-size:21px;letter-spacing:-.02em;display:block;line-height:1.15;color:var(--ink)}
#brand span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
#ldot{width:7px;height:7px;border-radius:50%;background:var(--grn);display:inline-block;animation:pulse 2.2s infinite}
#ldot.bad{background:#e5484d;animation:none}
.hbtn{width:38px;height:38px;border-radius:12px;background:var(--card);
  display:flex;align-items:center;justify-content:center;position:relative;flex:none;box-shadow:var(--sh-md)}
.hbtn svg{width:18px;height:18px;stroke:var(--ink2)}
.hbtn:active{transform:scale(.92)}
#nbadge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.hbtn.alert svg{stroke:var(--red)}

/* ─── статистика ─── */
#hero{padding:14px 18px 0;text-align:center;font-size:13px;font-weight:700;color:var(--mut)}
#hero .accent{font-weight:900;font-size:15px;color:var(--accent)}
#hero .hsep{color:var(--faint);margin:0 6px;font-weight:400}
#fresh{padding:11px 18px 0;font-size:11.5px;color:var(--mut);font-weight:700;display:flex;gap:7px;align-items:center;justify-content:center}
#fresh i{width:6px;height:6px;border-radius:50%;background:var(--grn);flex:none}
#fresh.ok i{background:#2fbf71;box-shadow:0 0 7px #2fbf71}
#fresh.bad i{background:#e5484d;box-shadow:0 0 7px #e5484d}
#fresh.bad{color:#e5484d}
#brandStrip{display:flex;align-items:center;gap:12px;margin:2px 18px 0;padding:11px 16px;background:var(--card);border-radius:18px;box-shadow:var(--sh-md)}
#brandStrip img{width:38px;height:38px;border-radius:12px;flex:none}
#brandStrip .bsTxt b{display:block;font-size:12.5px;letter-spacing:.16em;font-weight:900}
#brandStrip .bsTxt span{font-size:10.5px;color:var(--mut);font-weight:700}
.sart,.cimgw,.fdot{position:relative}
.sart,.cimgw{background:linear-gradient(100deg,var(--card2) 30%,var(--card) 50%,var(--card2) 70%);background-size:220% 100%;animation:skel 1.2s linear infinite}
.sart img,.cimgw img,.fdot img{opacity:0;transition:opacity .22s}
.sart img.ld,.cimgw img.ld,.fdot img.ld{opacity:1}
@keyframes skel{0%{background-position:120% 0}100%{background-position:-120% 0}}

/* ─── панель 5 сканеров ─── */
#scanBox{margin:16px 18px 0;background:var(--card);border-radius:20px;
  padding:14px 15px 8px;box-shadow:var(--sh-md)}
.scanH{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.scanH b{font-size:12px;font-weight:800;letter-spacing:.02em}
.scanH span{font-size:10px;color:var(--mut);font-weight:700}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln)}
.srow:last-child{border-bottom:none}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--grn);animation:breathe 2.4s infinite}
.sdot.off{background:var(--faint);animation:none}
.sinfo{flex:1;min-width:0}
.sname{font-size:11.5px;font-weight:800}
.sname i{font-style:normal;color:var(--accent);margin-left:5px;font-weight:700}
.stitle{font-size:9.5px;color:var(--mut);font-weight:600;letter-spacing:.01em}
.sstat{font-size:10px;color:var(--mut);font-weight:700;flex:none;text-align:right;line-height:1.35}
.sstat b{color:var(--ink);font-weight:800}

/* ─── секции ─── */
main{padding:0 0 20px}
.pane{display:none}
.pane.on{display:block;animation:fadeUp .32s ease}
.sec{padding:20px 0 0}
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px;margin-bottom:12px}
.sech h2{font-weight:900;font-size:20px;letter-spacing:-.01em}
.sech .cnt{font-size:11px;color:var(--mut);font-weight:800;letter-spacing:.02em}

/* ─── поиск (как в референсе) ─── */
.searchWrap{position:relative;padding:0 18px}
.searchWrap svg{position:absolute;left:32px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);pointer-events:none}

/* ─── витрина: карточки с реальными фото ─── */
#showRow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:6px 18px 18px;margin:0;scrollbar-width:none}
#showRow::-webkit-scrollbar{display:none}
.scard{
  flex:none;width:188px;scroll-snap-align:start;border-radius:22px;position:relative;overflow:hidden;
  background:var(--card);box-shadow:var(--sh-lg);
  animation:rise .4s both;animation-delay:var(--d,0ms);
}
.scard:active{transform:scale(.97);transition:.12s}
.sart{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:var(--card2)}
.sart img{width:100%;height:100%;object-fit:cover}
.sart .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;color:hsl(var(--h) 70% 55%);background:hsl(var(--h) 70% 95%)}
body.dark .sart .fb{background:hsl(var(--h) 40% 18%);color:hsl(var(--h) 70% 65%)}
.sover{padding:10px 12px 12px}
.sover .sname{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sover .snum{font-weight:900;font-size:16.5px;line-height:1.25;color:var(--accent)}
.sover .sago{font-size:10.5px;font-weight:700;color:var(--mut)}
.schip{position:absolute;top:9px;right:9px;background:rgba(15,20,30,.55);backdrop-filter:blur(6px);color:#fff;font-size:9px;font-weight:800;
  letter-spacing:.08em;padding:5px 9px;border-radius:9px}
.schip.hot{background:var(--red);animation:pulse 1.6s infinite}

/* ─── лента ─── */
#feedList{padding:0 18px}
.frow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--ln)}
.frow:last-child{border-bottom:none}
.fdot{width:42px;height:42px;border-radius:13px;flex:none;overflow:hidden;position:relative;background:var(--card2);box-shadow:var(--sh-md)}
.fdot img{width:100%;height:100%;object-fit:cover}
.fdot span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;
  color:hsl(var(--h) 70% 50%);background:hsl(var(--h) 70% 95%)}
body.dark .fdot span{background:hsl(var(--h) 40% 18%);color:hsl(var(--h) 70% 65%)}
.fbody{flex:1;min-width:0}
.f1{font-weight:800;font-size:13.5px}
.f1 .fnum{font-weight:900;color:var(--accent);font-size:13.5px}
.f2{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
.ftime{font-size:10.5px;color:var(--faint);font-weight:700;flex:none}

/* ─── каталог всех подарков (фото как на Fragment) ─── */
#colGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.ccard{border-radius:20px;background:var(--card);overflow:hidden;position:relative;box-shadow:var(--sh-md);
  animation:rise .4s both;animation-delay:var(--d,0ms)}
.ccard:active{transform:scale(.97);transition:.12s}
.ccard.fin{opacity:.6}
.cimgw{position:relative;aspect-ratio:1.1;overflow:hidden;background:var(--card2)}
.ccard img{width:100%;height:100%;object-fit:cover}
.cfb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:28px;color:hsl(var(--h) 70% 50%);background:hsl(var(--h) 70% 94%)}
body.dark .cfb{background:hsl(var(--h) 40% 17%);color:hsl(var(--h) 70% 65%)}
.ctag{position:absolute;top:8px;right:8px;background:rgba(15,20,30,.6);backdrop-filter:blur(6px);color:#fff;font-size:8.5px;font-weight:800;
  letter-spacing:.06em;padding:4px 8px;border-radius:8px}
.ctag.hot{background:var(--red)}
.ctag.fin{background:var(--grn)}
.cinfo{padding:10px 11px 11px}
.cname{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum{font-size:11px;color:var(--mut);margin:2px 0 8px;font-weight:700}
.cbar{height:5px;border-radius:4px;background:var(--card2);overflow:hidden;margin-bottom:8px}
.cbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg, var(--accent2), var(--accentD))}
.ceta{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;font-weight:700;color:var(--mut)}
.ceta b{font-weight:800;color:var(--grn)}
.ceta b.m{color:var(--amb)}
.ceta b.l{color:var(--faint);font-weight:700}

/* ─── настройки ─── */
.srowS{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px;border-bottom:1px solid var(--ln)}
.srowS .st b{font-size:13px;font-weight:800;display:block}
.srowS .st span{font-size:11px;color:var(--mut);font-weight:600}
.sw{width:48px;height:28px;border-radius:15px;background:var(--card2);position:relative;transition:.25s;flex:none;border:1px solid var(--ln2)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.25s}
.sw.on{background:linear-gradient(135deg, var(--accent2), var(--accentD));border-color:transparent}
.sw.on::after{left:24px}
.note{font-size:11.5px;color:var(--mut);line-height:1.7;padding-top:14px;font-weight:500}
.btn{background:linear-gradient(135deg, var(--accent2), var(--accentD));color:#fff;font-weight:800;font-size:14px;border-radius:15px;padding:14px 18px;
  box-shadow:0 10px 22px -6px hsla(200 70% 45% / .45);letter-spacing:.01em;text-align:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);box-shadow:none;color:var(--ink)}

/* ─── нижняя навигация: классический edge-to-edge таб-бар ─── */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:45;display:flex;
  background:color-mix(in srgb, var(--card) 94%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--ln);padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--faint)}
.ticon{width:30px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:.2s}
.ticon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.tlabel{font-size:10px;font-weight:800;letter-spacing:.01em}
.tbtn.on{color:var(--accent)}
.tbtn.on .ticon{background:hsla(200 80% 50% / .13)}
.tbtn.on .ticon svg{fill:currentColor;stroke:none}
.tbtn:active{transform:scale(.93)}

/* ─── оверлеи ─── */
#ovl{position:fixed;inset:0;background:rgba(10,16,26,.5);z-index:60;opacity:0;pointer-events:none;transition:.25s}
#ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg);border-radius:26px 26px 0 0;
  padding:12px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(103%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  max-height:84vh;overflow-y:auto;box-shadow:0 -20px 50px rgba(0,0,0,.22)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:var(--ln2);margin:0 auto 14px}
.shgrid{display:flex;gap:14px;align-items:flex-start}
.shimgw{width:100px;height:100px;border-radius:20px;flex:none;position:relative;overflow:hidden;box-shadow:var(--sh-lg);background:var(--card2)}
.shimgw img{width:100%;height:100%;object-fit:cover}
.shfb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:34px;color:hsl(var(--h) 70% 50%);background:hsl(var(--h) 70% 94%)}
.shtitle{flex:1;min-width:0;padding-top:3px}
.shtitle h3{font-weight:900;font-size:20px;line-height:1.15;margin-bottom:5px}
.bignum{font-weight:800;font-size:14px;color:var(--accent)}
.meter{height:9px;border-radius:6px;background:var(--card2);overflow:hidden;margin:15px 0 13px}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg, var(--accent2), var(--accentD))}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvc{background:var(--card2);border-radius:16px;padding:10px 12px}
.kvc .k{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.kvc .v{font-weight:900;font-size:16px;margin-top:3px}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.minilist .mr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:12.5px;font-weight:600}
.shbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}

/* панель уведомлений */
#novl{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.38);opacity:0;visibility:hidden;transition:opacity .25s}
#novl.on{opacity:1;visibility:visible}
#npanel{position:fixed;inset:0 0 0 auto;width:min(92vw,380px);z-index:80;background:var(--bg);
  transform:translateX(103%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.2)}
#npanel.on{transform:none}
.nphead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--ln)}
.nphead b{font-weight:900;font-size:17px}
#nlist{flex:1;overflow-y:auto;padding:6px 18px}
.ntf{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.ntf .ni{width:38px;height:38px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;background:hsla(200 80% 50% / .13)}
.ntf .nb{flex:1;min-width:0}
.ntf .nt{font-weight:800;font-size:12.5px}
.ntf .nm{font-size:11px;color:var(--mut);margin-top:2px;font-weight:600}
.ntf .tm{font-size:10px;color:var(--faint);flex:none;font-weight:700}
#nbanners{position:fixed;top:12px;left:12px;right:12px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nban{pointer-events:auto;display:flex;gap:11px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;
  animation:fadeUp .3s ease;box-shadow:var(--sh-lg)}
.nban.out{opacity:0;transform:translateY(-14px);transition:.3s}
.nban .ni{width:36px;height:36px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;background:hsla(200 80% 50% / .13)}
.nban .nt{font-weight:800;font-size:12px}
.nban .nm{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:1px}

#toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%) translateY(12px);z-index:95;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 17px;
  font-size:12.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:var(--sh-lg)}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{border-radius:18px;padding:30px 16px 24px;text-align:center;color:var(--faint);font-size:12.5px;margin:4px 0;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.empty svg{width:52px;height:52px;stroke:var(--faint);fill:none;stroke-width:1.5;margin-bottom:6px}
.empty b{font-size:14px;font-weight:800;color:var(--mut)}
.empty span{font-size:11.5px;color:var(--faint);font-weight:600}

/* ─── живой слой: анимация всех подарков ─── */
@keyframes floaty{0%,100%{transform:scale(1.12) translateY(0)}50%{transform:scale(1.15) translateY(-7px)}}
@keyframes shine{0%{transform:translateX(-160%) skewX(-14deg);opacity:0}8%{opacity:1}55%{transform:translateX(280%) skewX(-14deg);opacity:0}100%{transform:translateX(280%) skewX(-14deg);opacity:0}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.4}}
@keyframes aurora{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6%,-5%) scale(1.15)}66%{transform:translate(-6%,5%) scale(1.08)}}
body::before{content:'';position:fixed;inset:-22%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 32% at 20% 25%, hsla(200 90% 60% / .20), transparent 70%),
    radial-gradient(34% 30% at 78% 18%, hsla(150 80% 55% / .14), transparent 70%),
    radial-gradient(40% 34% at 55% 82%, hsla(260 90% 70% / .14), transparent 70%);

  '<div class="srowS"><div class="st"><b>ЗВУК УЛУЧШЕНИЯ</b><span>сигнал при новом апгрейде</span></div><div class="sw' + (SOUND ? ' on' : '') + '" id="swSound"></div></div>' +
  '<div class="srowS"><div class="st"><b>БАННЕРЫ</b><span>всплывающие уведомления</span></div><div class="sw' + (NQ.cfg.banners ? ' on' : '') + '" id="swBan"></div></div>' +
  '<div class="srowS"><div class="st"><b>ВИБРАЦИЯ</b><span>отклик при событии</span></div><div class="sw' + (NQ.cfg.vibro ? ' on' : '') + '" id="swVib"></div></div>' +
  '<div class="srowS"><div class="st"><b>ФИЛЬТР КОЛЛЕКЦИЙ</b><span>уведомления только о выбранных</span></div><button class="btn ghost" id="btnCols" style="padding:8px 14px;font-size:11px;font-weight:800">' + (NQ.cfg.cols && NQ.cfg.cols.length ? 'выбрано ' + NQ.cfg.cols.length : 'все') + '</button></div>' +
  '<div id="colFlt" style="display:none;max-height:240px;overflow:auto;border-top:1px solid var(--line);margin-top:6px;padding-top:8px">' +
    '<div style="display:flex;gap:6px;margin-bottom:8px"><input id="colQ" placeholder="поиск коллекции" style="flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:12px;outline:none"><button class="btn ghost" id="colAll" style="padding:8px 12px;font-size:11px;font-weight:800">все</button></div>' +
    '<div id="colList" style="display:flex;flex-direction:column;gap:2px"></div>' +
  '</div>' +
  '<div class="note">GIFT ATELIER · 5 независимых сканеров непрерывно опрашивают первоисточник Telegram (постоянный воркер), сайт обновляется каждые 4 секунды напрямую с raw-канала данных. Имена коллекций — nft.fragment.com.</div>';
  $('setBody').innerHTML = html;
  Array.prototype.forEach.call($('setBody').querySelectorAll('[data-th]'), function(b){
    b.addEventListener('click', function(){ THEME = b.getAttribute('data-th'); localStorage.setItem('gm_theme', THEME); applyTheme(); renderSettings(); });
  });
  $('swSound').addEventListener('click', function(){ SOUND = !SOUND; localStorage.setItem('gm_sound', SOUND ? '1' : '0'); renderSettings(); });
  $('swAnim').addEventListener('click', function(){ setAnim(!ANIM); renderSettings(); });
  $('swBan').addEventListener('click', function(){ NQ.cfg.banners = !NQ.cfg.banners; nqSave(); renderSettings(); });
  $('swVib').addEventListener('click', function(){ NQ.cfg.vibro = !NQ.cfg.vibro; nqSave(); renderSettings(); });
  $('btnCols').addEventListener('click', function(){
    var p = $('colFlt'); p.style.display = p.style.display === 'none' ? 'block' : 'none';
    if (p.style.display === 'block') renderColFilter();
  });
  $('colQ').addEventListener('input', renderColFilter);
  $('colAll').addEventListener('click', function(){ NQ.cfg.cols = null; nqSave(); renderColFilter(); $('btnCols').textContent = 'все'; });
}
function renderColFilter(){
  var q = ($('colQ') ? $('colQ').value : '').toLowerCase();
  var sel = NQ.cfg.cols || [];
  var list = giftsData.filter(function(g){ return !q || String(g.name||g.slug).toLowerCase().indexOf(q) >= 0; }).slice(0, 80);
  $('colList').innerHTML = list.map(function(g){
    var s = String(g.slug||g.name).trim();
    var on = !NQ.cfg.cols || sel.indexOf(s) >= 0;
    return '<div class="cfrow" data-s="' + esc(s) + '" style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700"><span class="cfk" style="width:18px;height:18px;border-radius:6px;flex:none;background:' + (on ? 'var(--accent)' : 'var(--card2)') + '"></span>' + esc(g.name||s) + '</div>';
  }).join('');
  Array.prototype.forEach.call($('colList').querySelectorAll('.cfrow'), function(r){
    r.addEventListener('click', function(){
      var s = r.getAttribute('data-s');
      var cur = NQ.cfg.cols ? NQ.cfg.cols.slice() : giftsData.map(function(g){ return String(g.slug||g.name).trim(); });
      var ix = cur.indexOf(s);
      if (ix >= 0) cur.splice(ix, 1); else cur.push(s);
      NQ.cfg.cols = cur.length ? cur : null;
      nqSave(); renderColFilter();
      $('btnCols').textContent = NQ.cfg.cols && NQ.cfg.cols.length ? ('выбрано ' + NQ.cfg.cols.length) : 'все';
    });
  });
}</script>

<script>
"use strict";
/* ═══ собственная система уведомлений (внутри мини-апа) ═══ */
var NQ = { list: [], unread: 0, cfg: { sound: true, vibro: true, banners: true, cols: null } };
function nqLoad(){
  try { var l = JSON.parse(localStorage.getItem('radar_nq') || '[]'); if (Object.prototype.toString.call(l) === '[object Array]') NQ.list = l.slice(0, 50); } catch(e){}
  try { var c = JSON.parse(localStorage.getItem('radar_ncfg') || 'null'); if (c) NQ.cfg = { sound: c.sound !== false, vibro: c.vibro !== false, banners: c.banners !== false, cols: (Object.prototype.toString.call(c.cols) === '[object Array]' ? c.cols : null) }; } catch(e){}
}
function nqSave(){
  try { localStorage.setItem('radar_nq', JSON.stringify(NQ.list.slice(0, 50))); } catch(e){}
  try { localStorage.setItem('radar_ncfg', JSON.stringify(NQ.cfg)); } catch(e){}
}
function nqAgo(ts){ var m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'сейчас'; if (m < 60) return m + 'м'; return Math.round(m/60) + 'ч'; }
function nqSound(kind){
  if (!NQ.cfg.sound) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    var ctx = nqSound.ctx || (nqSound.ctx = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime;
    var freqs = kind === 'upg' ? [659.25, 783.99] : [523.25, 659.25];
    freqs.forEach(function(f, i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * .12);
      g.gain.exponentialRampToValueAtTime(.16, t + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .12 + .28);
      o.connect(g); g.connect(ctx.destination);
      o.start(t + i * .12); o.stop(t + i * .12 + .3);
    });
  } catch(e){}
}
function nqVibro(){
  if (!NQ.cfg.vibro) return;
  try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); return; } } catch(e){}
  try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch(e){}
}
function nqPush(type, ico, title, msg, slug, num){
  var n = { id: type+'-'+slug+'-'+num+'-'+Date.now(), type: type, ico: ico, title: title, msg: msg, slug: slug, num: num, ts: Date.now(), read: false };
  NQ.list.unshift(n);
  if (NQ.list.length > 50) NQ.list.length = 50;
  NQ.unread++; nqSave(); nqBadge(); nqRender();
  if (NQ.cfg.banners) nqBanner(n);
  nqSound(type); nqVibro();
}
function nqBadge(){
  var b = $('nbadge'); if (!b) return;
  b.textContent = NQ.unread > 99 ? '99+' : (NQ.unread > 0 ? String(NQ.unread) : '');
  b.style.display = NQ.unread > 0 ? 'flex' : 'none';
  $('btnBell').classList.toggle('alert', NQ.unread > 0);
}
function nqBanner(n){
  var wrap = $('nbanners'); if (!wrap) return;
  var d = document.createElement('div');
  d.className = 'nban ' + n.type;
  d.innerHTML = '<div class="ni">' + n.ico + '</div><div class="nb"><div class="nt">' + esc(n.title) + '</div><div class="nm">' + esc(n.msg) + '</div></div>';
  d.addEventListener('click', function(){ d.remove(); if (n.slug) openColSheet(n.slug); });
  wrap.appendChild(d);
  setTimeout(function(){ d.classList.add('out'); setTimeout(function(){ d.remove(); }, 320); }, 5200);
}
function nqRender(){
  var list = $('nlist'); if (!list) return;
  if (!NQ.list.length){ list.innerHTML = '<div class="empty" style="border:none">уведомлений нет</div>'; return; }
  list.innerHTML = NQ.list.map(function(n){
    return '<div class="ntf ' + n.type + '" data-id="' + esc(n.id) + '">' +
      '<div class="ni">' + n.ico + '</div>' +
      '<div class="nb"><div class="nt">' + esc(n.title) + '</div><div class="nm">' + esc(n.msg) + '</div></div>' +
      '<div class="tm">' + nqAgo(n.ts) + '</div></div>';
  }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('.ntf'), function(el){
    el.addEventListener('click', function(){
      var n = null;
      for (var i=0;i<NQ.list.length;i++) if (NQ.list[i].id === el.getAttribute('data-id')) { n = NQ.list[i]; break; }
      if (!n) return;
      n.read = true; nqSave(); el.style.opacity = .6; nqBadge();
      if (n.slug){ $('npanel').classList.remove('on'); openColSheet(n.slug); }
    });
  });
}
function nqPanelClose(){
  $('npanel').classList.remove('on'); $('novl').classList.remove('on');
}
function nqPanelToggle(){
  var p = $('npanel'); if (!p) return;
  var on = p.classList.toggle('on');
  $('novl').classList.toggle('on', on);
  haptic();
  if (on){ NQ.list.forEach(function(n){ n.read = true; }); NQ.unread = 0; nqSave(); nqBadge(); nqRender(); }
}
function nqClear(){ NQ.list = []; NQ.unread = 0; nqSave(); nqBadge(); nqRender(); haptic(); }
$('btnBell').addEventListener('click', nqPanelToggle);
$('npClear').addEventListener('click', nqClear);
$('npClose').addEventListener('click', nqPanelClose);
$('novl').addEventListener('click', nqPanelClose);
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') nqPanelClose(); });
nqLoad(); nqBadge(); nqRender();</script>

<script>
"use strict";
/* ═══ refresh-цикл данных (обновляется каждые 6 секунд) ═══ */
var liveTsMax = 0, firstLoad = true, lastSeenTs = 0, lastRaw = '';
function beep(){
  if (!SOUND) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=0.18;
    o.connect(g); g.connect(ctx.destination); o.start();
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime+0.18);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.45);
    o.stop(ctx.currentTime+0.46);
  } catch(e){}
}
function newUpgradeAlert(evts){
  if (firstLoad){ firstLoad = false; if (evts.length) lastSeenTs = evts[0].mint || 0; return; }
  var fresh = [];
  for (var i=0;i<evts.length;i++){ var t = evts[i].mint || 0; if (t > lastSeenTs) fresh.push(evts[i]); }
  /* фильтр коллекций: уведомляем только о выбранных */
  var flt = NQ.cfg.cols;
  var notify = flt && flt.length ? fresh.filter(function(e){ return flt.indexOf(e.slug) >= 0; }) : fresh;
  if (notify.length && lastSeenTs){
    beep();
    var newest = notify[0];
    var slug = String(newest.slug||'').trim();
    var nm = newest.gift || slug;
    var num = newest.counter_issued || newest.number || 0;
    nqPush('upg','🚀','УЛУЧШЕНИЕ · ' + nm,
      notify.length > 1 ? ('#' + fmtNum(num) + ' и ещё ' + (notify.length - 1) + ' — поймано ' + notify.length + ' новых') : ('номер #' + fmtNum(num) + ' улучшен до NFT'),
      slug, Number(num));
  }
  if (evts.length) lastSeenTs = evts[0].mint || 0;
}

function tickAgo(){
  /* индикатор свежести: от реального last_scan_at бэкенда, обновляется каждую секунду */
  var su = Number(statD.updated_unix)||0;
  var fr = $('fresh'), fx = $('freshTx');
  if (su){
    var age = Math.max(0, Math.floor(Date.now()/1000) - su);
    var stale = age > 60;
    if (fr){ fr.classList.toggle('bad', stale); fr.classList.toggle('ok', !stale); }
    if (fx) fx.textContent = stale ? ('данные устарели · ' + agoSec(age) + ' назад') : ('живой канал · ' + agoSec(age) + ' назад');
    var ld = $('ldot'), up = $('upd');
    if (ld) ld.classList.toggle('bad', stale);
    if (up) up.textContent = stale ? 'обновление задержалось' : '5 сканеров в дозоре';
  }
  /* относительное время каждого события — тикает без перерисовки DOM */
  var nowS = Math.floor(Date.now()/1000);
  var els = document.querySelectorAll('[data-ago]');
  for (var i=0;i<els.length;i++) els[i].textContent = agoSec(nowS - Number(els[i].getAttribute('data-ago'))||0);
  /* NEW-бейдж живёт ровно 2 минуты */
  var nw = document.querySelectorAll('[data-new]');
  for (var j=0;j<nw.length;j++){
    if (nowS - Number(nw[j].getAttribute('data-new')) > 120){ nw[j].parentNode.removeChild(nw[j]); }
  }
}

function renderAll(){
  var row = $('showRow'); var sl = row ? row.scrollLeft : 0;
  var pageY = window.scrollY;
  renderStats(); renderScanners(); renderShowcase(); renderFeed(); renderCatalog(); hookAnim();
  var row2 = $('showRow'); if (row2) row2.scrollLeft = sl;
  if (Math.abs(window.scrollY - pageY) > 2) window.scrollTo(0, pageY);
}
function refresh(light){
  var FETCHES = light
    ? [jget('status.json'), jget('gifts.json'), null, jget('live.json').catch(function(){ return { items: {} }; })]
    : [jget('status.json'), jget('gifts.json'), jget('history.json').catch(function(){ return { hours: [] }; }), jget('live.json').catch(function(){ return { items: {} }; })];
  Promise.all(FETCHES)
  .then(function(res){
    if (res[0] && res[0].__stale && feedEvents.length) { tickAgo(); return; }
    var raw = JSON.stringify(res[0]) + '|' + JSON.stringify(res[3]||{});
    if (raw === lastRaw){ tickAgo(); return; }
    lastRaw = raw;
    statD = res[0] || {};
    histData = (res[2] && res[2].hours) ? res[2].hours : (histData || []);
    giftsData = (res[1] && res[1].gifts) ? res[1].gifts : [];
    if (statD.scanners) scannerData = statD.scanners;
    var liveItems = (res[3] && res[3].items) ? res[3].items : {};
    var lvTs = 0;
    for (var lk in liveItems){ var lt = liveItems[lk] && Number(liveItems[lk].ts)||0; if (lt > lvTs) lvTs = lt; }
    liveTsMax = lvTs;
    if (liveItems) giftsData.forEach(function(g){
      var lv = liveItems[String(g.slug||g.name).trim()];
      if (!lv) return;
      var li = Number(lv.i)||0, gi = Number(g.issued)||0;
      if (li >= gi){ g.issued = li; g.total = Number(lv.t)||Number(g.total)||0; }
    });
    buildSlugMap();
    var evts = (statD.last_upgrades||[]).map(function(e){
      var c = { slug: rslug(e.slug, e.gift), gift: e.gift, number: Number(e.number)||0, counter_issued: e.counter_issued, mint: e.mint, art: e.art || null };
      return c;
    }).filter(function(e){
      if (!e.slug || !e.number) return false;
      return true;
    });
    /* дедупликация slug+номер: дубль сканера не попадает в ленту дважды */
    var seen = {};
    evts = evts.filter(function(e){ var k = e.slug + '#' + e.number; if (seen[k]) return false; seen[k] = true; return true; });
    evts.sort(function(a2,b2){
      var ta = evTs(a2), tb = evTs(b2);
      if (tb !== ta) return tb - ta;
      return b2.number - a2.number;
    });
    feedEvents = evts;
    hotMap = {};
    var dayAgo = Date.now()/1000 - 86400;
    evts.forEach(function(e){
      var t = evTs(e); var key = e.slug;
      if (t < dayAgo) return;
      if (!hotMap[key] || t > hotMap[key]) hotMap[key] = t;
    });
    newUpgradeAlert(evts);
    renderAll();
    /* NEW — только для событий после последнего визита */
    localStorage.setItem('gm_lastvisit', String(Math.floor(Date.now()/1000)));
  })
  .catch(function(){});
}

/* ═══ BOOT: мгновенный первый кадр без сети ═══ */
(function bootPrime(){
  if (!window.BOOT || !window.BOOT.g) return;
  window.BOOT.g.forEach(function(x){
    giftsData.push({ slug: x[0], name: x[1] || x[0], issued: x[2], total: x[3], rate: 0, added: 0 });
  });
  statD = { updated_unix: window.BOOT.ts, detected_total: window.BOOT.u, last_upgrades: window.BOOT.r || [] };
  if (window.BOOT.s) scannerData = window.BOOT.s;
  feedEvents = (statD.last_upgrades || []).slice();
  var dayAgo = Date.now()/1000 - 86400;
  buildSlugMap();
  feedEvents.forEach(function(e){
    e.slug = rslug(e.slug, e.gift);
  });
  feedEvents.forEach(function(e){
    var t = evTs(e); var key = e.slug;
    if (!key || t < dayAgo) return;
    if (!hotMap[key] || t > hotMap[key]) hotMap[key] = t;
  });
  renderAll();
})();

refresh(true);
setTimeout(function(){ refresh(false); }, 2500);
setInterval(function(){ if (!document.hidden) refresh(true); }, 4000);
setInterval(function(){ if (!document.hidden) tickAgo(); }, 1000);
setInterval(function(){ refresh(false); }, 180000);
setInterval(function(){ if (feedEvents.length || giftsData.length) renderStats(); }, 30000);</script>
